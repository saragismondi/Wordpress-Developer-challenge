server {
    listen 443 ssl;
    server_name www.agronews.example agronews.example;

    ssl_certificate     /etc/edge/certs/edge.crt;
    ssl_certificate_key /etc/edge/certs/edge.key;

    root /var/www/agronews;

    location / {
        # Edge round trip towards the origin.
        access_by_lua_block { ngx.sleep(1.6) }

        default_type application/json;
        add_header X-AN-Edge "hit" always;
        add_header Cache-Control "public, max-age=300" always;
    }
}

server {
    listen 80;
    server_name www.agronews.example agronews.example;

    return 301 https://$host$request_uri;
}
